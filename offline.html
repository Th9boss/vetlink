<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d5c">
  <title>VETLINK - Hors ligne</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --ink: #122033;
      --muted: #617086;
      --line: #d9e0ea;
      --accent: #0a66ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(10,102,255,.12), transparent 32%),
        linear-gradient(180deg, #fbfdff 0%, var(--bg) 100%);
    }
    .card {
      width: min(100%, 420px);
      padding: 28px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      box-shadow: 0 24px 60px rgba(12, 31, 61, .12);
      text-align: center;
      backdrop-filter: blur(12px);
    }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 18px 0 10px; font-size: 28px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/pwa/192x192.png" alt="VETLINK">
    <h1>VETLINK</h1>
    <p>Connexion indisponible hors ligne. Reconnectez-vous au reseau pour continuer.</p>
    <a href="./index.php?page=login">Reessayer</a>
  </main>
</body>
</html>
